<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลอยกระทงออนไลน์ - Zero-Config QR & PeerJS Sync</title>
    <!-- ไลบรารีสร้าง QR Code สำหรับสแกนด้วยมือถือ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- ไลบรารี PeerJS (WebRTC) สำหรับส่งข้อมูลกระทงจากมือถือขึ้นจอหลักอัตโนมัติโดยไม่ต้องตั้งค่าเซิร์ฟเวอร์ -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* ==========================================
           1. ระบบ CSS แบบ Standalone
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', 'Sarabun', 'Thonburi', 'Leelawadee UI', 'Tahoma', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background-color: #050a18;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 100vw;
            height: 100vh;
        }

        /* ซ่อนปุ่มหรือตัวควบคุมการลบในโหมดผู้สแกนบนมือถือ */
        body.mobile-scanner-mode [data-action*="delete" i],
        body.mobile-scanner-mode [data-action*="remove" i],
        body.mobile-scanner-mode [data-action*="clear" i],
        body.mobile-scanner-mode button[onclick*="Clear" i],
        body.mobile-scanner-mode button[onclick*="Delete" i],
        body.mobile-scanner-mode button[onclick*="Remove" i],
        body.mobile-scanner-mode .delete-btn,
        body.mobile-scanner-mode .btn-delete,
        body.mobile-scanner-mode .remove-btn,
        body.mobile-scanner-mode .btn-danger-glass {
            display: none !important;
        }

        /* แอนิเมชันแสงจันทร์เรืองรอง */
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 60px 20px rgba(254, 240, 138, 0.4), 0 0 120px 45px rgba(253, 224, 71, 0.22); }
            50% { box-shadow: 0 0 85px 32px rgba(254, 240, 138, 0.58), 0 0 155px 60px rgba(253, 224, 71, 0.32); }
        }
        .moon-glow {
            animation: moonGlow 6s infinite ease-in-out;
        }

        /* แอนิเมชันเปลวเทียนไหว */
        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-1deg); opacity: 0.95; }
            25% { transform: scale(1.06, 0.95) rotate(2deg); opacity: 1; }
            50% { transform: scale(0.95, 1.05) rotate(-2deg); opacity: 0.85; }
            75% { transform: scale(1.04, 0.98) rotate(1deg); opacity: 1; }
        }
        .candle-flame {
            transform-origin: bottom center;
            animation: flicker 1.2s infinite ease-in-out;
        }

        /* แอนิเมชันกระทงลอยโคลงเคลงเบาๆ */
        @keyframes bobbing {
            0%, 100% { transform: translateY(0px) rotate(-1.6deg); }
            50% { transform: translateY(-6px) rotate(1.6deg); }
        }
        .krathong-bob {
            animation: bobbing 3.6s infinite ease-in-out;
        }

        /* แอนิเมชันป้ายชื่อลอยตาม */
        @keyframes floatTag {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .wish-tag {
            animation: floatTag 3.6s infinite ease-in-out;
            animation-delay: 0.25s;
        }

        /* แอนิเมชันเปิด Modal */
        @keyframes modalPopIn {
            0% { opacity: 0; transform: scale(0.93) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-animate {
            animation: modalPopIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* เอฟเฟกต์กระจกฝ้า (Glassmorphism) */
        .glass-panel {
            background: rgba(12, 20, 38, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(253, 224, 71, 0.28);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        /* โครงสร้างหลักของฉากแม่น้ำ */
        #river-view {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        #scene-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* พระจันทร์เต็มดวง */
        #full-moon {
            position: absolute;
            top: 3.5rem;
            right: 4rem;
            width: 7.5rem;
            height: 7.5rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #fef9c3 0%, #fde68a 50%, #facc15 100%);
            z-index: 0;
            pointer-events: none;
        }
        #full-moon-craters {
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            opacity: 0.22;
            background: radial-gradient(circle at 30% 30%, #b45309 0%, transparent 25%),
                        radial-gradient(circle at 70% 60%, #b45309 0%, transparent 30%),
                        radial-gradient(circle at 45% 75%, #b45309 0%, transparent 20%);
        }

        /* เส้นขอบฟ้าวัดอรุณฯ และสะพานพระราม 8 */
        #skyline-silhouette {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 43%;
            height: 11rem;
            z-index: 0;
            pointer-events: none;
            opacity: 0.88;
        }

        /* เลเยอร์กระทงในแม่น้ำ */
        #krathong-river-layer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 46%;
            z-index: 10;
            overflow: hidden;
        }

        /* ส่วนหัว (Header) */
        header {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.85rem;
            padding: 1.15rem 1.75rem;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .brand-icon {
            width: 3.1rem;
            height: 3.1rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #fbbf24 0%, #ea580c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.65rem;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
            border: 1px solid rgba(254, 240, 138, 0.45);
        }

        .brand-title {
            font-size: 1.45rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fef08a 0%, #fde047 50%, #fbbf24 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 0.01em;
        }

        .brand-subtitle-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.15rem;
            font-size: 0.82rem;
            color: rgba(254, 243, 199, 0.85);
        }

        .live-pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.15rem 0.6rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(52, 211, 153, 0.45);
            color: #6ee7b7;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .song-link-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.18rem 0.65rem;
            border-radius: 9999px;
            background: rgba(250, 204, 21, 0.16);
            border: 1px solid rgba(250, 204, 21, 0.42);
            color: #fde047;
            font-size: 0.72rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .song-link-chip:hover {
            background: rgba(250, 204, 21, 0.28);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            flex-wrap: wrap;
        }

        .counter-pill {
            padding: 0.45rem 0.9rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .counter-label {
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        .counter-value {
            font-size: 1rem;
            font-weight: 700;
            color: #fcd34d;
        }

        /* ปุ่มมาตรฐาน */
        .btn {
            cursor: pointer;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn-icon-glass {
            padding: 0.6rem 0.85rem;
            border-radius: 0.95rem;
            color: #fde68a;
            font-size: 0.84rem;
            font-weight: 500;
        }
        .btn-icon-glass:hover {
            background: rgba(245, 158, 11, 0.22);
            border-color: rgba(250, 204, 21, 0.55);
        }

        .btn-danger-glass {
            padding: 0.6rem 0.9rem;
            border-radius: 0.95rem;
            background: rgba(127, 29, 29, 0.45);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: #fecaca;
            font-size: 0.84rem;
            font-weight: 500;
        }
        .btn-danger-glass:hover {
            background: rgba(185, 28, 28, 0.65);
            border-color: rgba(252, 165, 165, 0.65);
            color: #ffffff;
        }

        /* แถบควบคุมหลักด้านล่าง */
        footer {
            position: relative;
            z-index: 20;
            padding: 1rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            pointer-events: none;
        }

        .footer-dock {
            pointer-events: auto;
            padding: 0.55rem;
            border-radius: 1.65rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
        }

        .btn-primary-launch {
            padding: 0.9rem 1.9rem;
            border-radius: 1.25rem;
            background: linear-gradient(135deg, #facc15 0%, #f59e0b 55%, #ea580c 100%);
            color: #0f172a;
            font-size: 1.08rem;
            font-weight: 700;
            box-shadow: 0 10px 28px rgba(245, 158, 11, 0.45);
            border: 1px solid rgba(254, 249, 195, 0.65);
        }
        .btn-primary-launch:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        .btn-secondary-dock {
            padding: 0.9rem 1.25rem;
            border-radius: 1.25rem;
            background: rgba(30, 41, 59, 0.85);
            color: #fecaca;
            font-size: 0.94rem;
            font-weight: 600;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }
        .btn-secondary-dock:hover {
            background: rgba(153, 27, 27, 0.55);
            color: #ffffff;
            border-color: rgba(248, 113, 113, 0.65);
        }

        .footer-hint {
            font-size: 0.78rem;
            color: rgba(226, 232, 240, 0.82);
            text-align: center;
            text-shadow: 0 2px 6px rgba(0,0,0,0.85);
        }

        /* การ์ดแจ้งเตือน Toast */
        #live-toast-container {
            position: fixed;
            top: 5.5rem;
            right: 1.5rem;
            z-index: 35;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: none;
            max-width: 22rem;
        }
        .toast-item {
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.45s ease;
        }

        /* กระทงแต่ละใบในแม่น้ำ */
        .river-krathong {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: filter 0.2s ease;
        }
        .river-krathong:hover {
            filter: brightness(1.12);
        }
        .river-tag {
            margin-bottom: 0.2rem;
            padding: 0.3rem 0.75rem;
            border-radius: 1rem;
            background: rgba(9, 14, 28, 0.82);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 195px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.55);
        }
        .river-tag.highlight {
            border-color: #facc15;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 0 18px rgba(250, 204, 21, 0.45);
        }
        .river-tag-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #fcd34d;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .river-tag-wish {
            font-size: 0.68rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .river-krathong-art {
            width: 6.8rem;
            height: 6.8rem;
        }

        /* ==========================================
           2. แผง QR Code มุมซ้ายล่าง (Host QR Dock)
           ========================================== */
        .qr-bottom-left-dock {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 28;
            width: 16.5rem;
            padding: 0.95rem;
            border-radius: 1.35rem;
            text-align: center;
            transition: all 0.25s ease;
        }
        .qr-bottom-left-dock.hidden-dock {
            display: none;
        }
        .qr-box-white {
            background: #ffffff;
            padding: 0.65rem;
            border-radius: 0.95rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0.45rem auto;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
        }
        .room-code-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(250, 204, 21, 0.16);
            border: 1px solid rgba(250, 204, 21, 0.45);
            color: #fde047;
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.08em;
        }
        .sync-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.22rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.71rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .sync-connected {
            background: rgba(16, 185, 129, 0.22);
            border: 1px solid rgba(52, 211, 153, 0.55);
            color: #6ee7b7;
        }
        .sync-demo {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(125, 211, 252, 0.5);
            color
